<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden — HerdenPilot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <meta name="theme-color" content="#2e7d32">
  <style>
    body { background: #f1f8e9; display: flex; align-items: center; min-height: 100vh; }
  </style>
</head>
<body>
<div class="container" style="max-width: 380px;">
  <div class="text-center mb-4">
    <div style="font-size:3rem; color:#2e7d32;"><i class="bi bi-compass"></i></div>
    <h1 class="h3 fw-bold" style="color:#2e7d32;">HerdenPilot</h1>
    <p class="text-muted small">Bitte Passwort eingeben</p>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Passwort</label>
          <input type="password" name="password"
                 class="form-control form-control-lg {% if error %}is-invalid{% endif %}"
                 autofocus autocomplete="current-password">
          {% if error %}
          <div class="invalid-feedback">Falsches Passwort</div>
          {% endif %}
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fs-5">
          <i class="bi bi-unlock"></i> Anmelden
        </button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
