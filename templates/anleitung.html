{% extends 'base.html' %}
{% block title %}Anleitung — HerdenPilot{% endblock %}
{% block content %}
<style>
  .anleitung h1 { font-size: 1.6rem; font-weight: 700; }
  .anleitung h2 { font-size: 1.3rem; font-weight: 700; margin-top: 1.5rem; padding-top: .5rem; scroll-margin-top: 1rem; }
  .anleitung h3 { font-size: 1.05rem; font-weight: 700; margin-top: 1rem; }
  .anleitung hr { margin: 1.5rem 0; opacity: .15; }
  .anleitung code { color: #2e7d32; background: #f1f8e9; padding: .05rem .3rem; border-radius: 4px; }
  .anleitung blockquote p { margin-bottom: 0; }
  .anleitung table { font-size: .92rem; }
  .anleitung li { margin-bottom: .2rem; }
</style>
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card">
      <div class="card-body p-3 p-md-4 anleitung">
        {{ inhalt | safe }}
      </div>
    </div>
    <div class="text-center mt-3">
      <a href="#" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-up"></i> Nach oben</a>
    </div>
  </div>
</div>
{% endblock %}
