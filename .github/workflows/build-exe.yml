name: Windows-exe bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pyinstaller

      - name: exe bauen
        run: >
          pyinstaller --noconfirm --onefile --name HerdenPilot
          --add-data "templates;templates"
          --add-data "static;static"
          desktop.py

      - name: exe als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: HerdenPilot-Windows
          path: dist/HerdenPilot.exe

      - name: exe an Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HerdenPilot.exe
