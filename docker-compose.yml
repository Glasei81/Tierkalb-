version: "3.8"

services:
  tierkalb:
    build: .
    container_name: tierkalb
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      # Werte kommen aus der lokalen .env-Datei (siehe .env.example).
      # Leer = automatisch (SECRET_KEY) bzw. kein Login (LOGIN_PASSWORD).
      - SECRET_KEY=${SECRET_KEY:-}
      - LOGIN_PASSWORD=${LOGIN_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
