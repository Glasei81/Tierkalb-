version: "3.8"

services:
  tierkalb:
    build: .
    container_name: tierkalb
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=bitte-hier-ein-langes-zufaelliges-passwort-eingeben
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
