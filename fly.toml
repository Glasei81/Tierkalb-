app = "herdenpilot"
primary_region = "fra"

[build]

[env]
  DATABASE_PATH = "/data/tierkalb.db"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "herdenpilot_data"
  destination = "/data"
